# Aplicación
spring.application.name=api-productos
server.port=8080

# Base de datos grano_de_oro (la creada con el script de la GA6; ver carpeta sql)
spring.datasource.url=jdbc:mysql://localhost:3306/grano_de_oro?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Bogota
spring.datasource.username=${GRANO_DB_USER:grano_app}
spring.datasource.password=${GRANO_DB_PASS:GranoApp2026}

# Hibernate NO crea ni modifica tablas: el esquema es el del script SQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Origen permitido para el front-end React (Vite)
granodeoro.cors.origen=http://localhost:5173
